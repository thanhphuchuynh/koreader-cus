<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaf IELTS Listening</title>
<style>
:root{--ink:#181818;--muted:#555;--line:#bbb;--soft:#e6e6e6;--bg:#eceeed;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}
header{max-width:1000px;margin:auto;padding:22px 16px 0}
header h1{font:24px/1.25 Georgia,serif;margin:0 0 6px}
header p{margin:0;color:#333;max-width:720px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.steps button{border:1px solid var(--ink);background:#fff;font:13px system-ui;padding:6px 10px;cursor:pointer;color:inherit}
.steps button.sel{background:var(--ink);color:#fff}
main{max-width:1000px;margin:auto;padding:18px 16px 32px;display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.device{width:450px;max-width:100%;height:600px;background:var(--paper);border:1px solid #aaa;position:relative;overflow:hidden;display:flex;flex-direction:column;flex-shrink:0}
.bar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--ink);font-size:13px;min-height:44px}
.grow{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.audio{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.track{flex:1;height:8px;border:1px solid var(--ink);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.track b{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink)}
.ctl{border:1px solid var(--ink);background:#fff;min-width:44px;height:36px;font:13px system-ui;cursor:pointer;color:inherit;padding:0 8px}
.ctl.primary{background:var(--ink);color:#fff}
.lock{font-size:12px;color:var(--muted)}
.view{flex:1;overflow:auto;padding:14px 20px}
.qhead{font-size:12px;color:var(--muted);margin:10px 0 4px;letter-spacing:.02em}
.instr{font-size:13px;margin:0 0 8px}
.note{border:1px solid var(--ink);padding:10px 12px;font:15px/1.9 Georgia,serif}
.note h3{font:600 14px system-ui;margin:0 0 4px;text-align:center}
.gap{display:inline-block;min-width:96px;border:0;border-bottom:2px solid var(--ink);padding:0 6px;font:15px Georgia,serif;background:#fff;text-align:center;cursor:pointer;color:inherit}
.gap.active{background:var(--ink);color:#fff}
.gap .n{font:11px system-ui;color:var(--muted)}
.gap.active .n{color:#ccc}
.replay{font:12px system-ui;border:0;background:none;text-decoration:underline;cursor:pointer;color:inherit;padding:0 0 0 4px}
.abc{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin:6px 0 10px}
.abc button{border:0;border-right:1px solid var(--ink);background:#fff;padding:9px 0;font:13px system-ui;cursor:pointer;color:inherit}
.abc button:last-child{border-right:0}
.abc button.sel{background:var(--ink);color:#fff}
.qtext{font:15px/1.5 Georgia,serif;margin:12px 0 2px}
.opt{font:14px/1.5 Georgia,serif;margin:0 0 0 10px}
.foot{display:flex;border-top:1px solid var(--ink)}
.foot button{flex:1;border:0;border-right:1px solid var(--line);background:#fff;padding:12px 0;font:13px system-ui;cursor:pointer;color:inherit}
.foot button:last-child{border-right:0}
.foot button.primary{background:var(--ink);color:#fff}
.kb{border-top:1px solid var(--ink);background:#f4f4f4;padding:6px}
.kb .field{background:#fff;border:1px solid var(--ink);padding:6px 8px;font:15px Georgia,serif;margin:0 0 6px;display:flex;justify-content:space-between}
.kb .row{display:flex;gap:4px;justify-content:center;margin:0 0 4px}
.kb .row span{flex:1;max-width:38px;border:1px solid #999;background:#fff;text-align:center;padding:6px 0;font:13px system-ui}
.kb .row span.wide{max-width:none;flex:3}
.home .card{border:1px solid var(--ink);padding:14px;margin:10px 0}
.home h2{font:19px Georgia,serif;margin:0 0 4px}
.meta{font-size:12px;color:var(--muted)}
.mode{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);margin:14px 0}
.mode button{border:0;border-right:1px solid var(--ink);background:#fff;padding:10px;font:13px system-ui;cursor:pointer;text-align:left;color:inherit}
.mode button:last-child{border-right:0}
.mode button.sel{background:var(--ink);color:#fff}
.mode small{display:block;font-size:11.5px;margin-top:4px;opacity:.8}
.score{font:34px Georgia,serif;margin:4px 0}
.res{padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px}
.mark{display:inline-block;width:18px;font-weight:700}
.tr p{font:15px/1.65 Georgia,serif;margin:0 0 10px}
.tr .who{font:600 12px system-ui;color:var(--muted);display:block}
.tr .ev{background:#ddd;outline:1px solid #888}
.tr .ts{font:11px system-ui;color:var(--muted)}
.notes{width:420px;max-width:100%;font-size:14px}
.notes h2{font:17px Georgia,serif;margin:0 0 8px}
.notes li{margin:0 0 8px}
.notes .q{border-left:3px solid var(--ink);padding:4px 10px;background:#fff;margin:12px 0}
</style>
</head>
<body>
<header>
  <h1>IELTS Listening on Leaf: Exam + Study</h1>
  <p>Kindle size, grayscale. Click through the steps. Sample questions are illustrative. The audio plays through Bluetooth, like Listen today.</p>
  <div class="steps" id="steps"></div>
</header>
<main>
  <div class="device" id="device"></div>
  <section class="notes" id="notes"></section>
</main>
<script>
'use strict';
const S={step:0,mode:'exam',playing:true,t:192,active:2,ans:{1:'reporter',3:'B'}};
const LEN=340;
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const Q=[{n:1,before:'Wanted: a',after:'for the morning show',at:85},{n:2,before:'Office: top floor of the old',after:'Hall',at:121},{n:4,before:'Training every',after:'evening',at:236}];
function topBar(){return `<div class="bar"><b>Listening · Section 1</b><span class="grow"></span><span class="timer">${S.mode==='exam'?'28:40':''}</span></div>`}
function audio(){
  const pct=100*S.t/LEN;
  if(S.mode==='exam')return `<div class="audio"><span>▶</span><div class="track"><i style="width:${pct}%"></i></div><span>${mmss(S.t)} / ${mmss(LEN)}</span><span class="lock">plays once</span></div>`;
  return `<div class="audio"><button class="ctl" data-a="back">−10s</button><button class="ctl primary" data-a="play">${S.playing?'❚❚':'▶'}</button><div class="track"><i style="width:${pct}%"></i></div><span>${mmss(S.t)}</span></div>`;
}
function gap(q){
  const v=S.ans[q.n]||'';
  const rp=S.mode==='study'?`<button class="replay" data-r="${q.at}">↺ ${mmss(q.at)}</button>`:'';
  return `${q.before} <button class="gap ${S.active===q.n&&S.step===2?'active':''}" data-g="${q.n}"><span class="n">${q.n}</span> ${v}</button> ${q.after}${rp}<br>`;
}
function questions(){
  return `<div class="view">
  <div class="qhead">QUESTIONS 1–2 · 4</div>
  <p class="instr">Complete the notes. Write <b>ONE WORD ONLY</b> for each answer.</p>
  <div class="note"><h3>Volunteer job at a local radio station</h3>${Q.slice(0,2).map(gap).join('')}${gap(Q[2])}</div>
  <div class="qhead">QUESTION 3</div>
  <p class="qtext">3  What does the speaker say about the hours?${S.mode==='study'?' <button class="replay" data-r="170">↺ 02:50</button>':''}</p>
  <p class="opt">A  They are fixed.<br>B  They can be agreed later.<br>C  They change every week.</p>
  <div class="abc">${['A','B','C'].map(x=>`<button class="${S.ans[3]===x?'sel':''}" data-c="${x}">${x}</button>`).join('')}</div>
  </div>`;
}
function keyboard(){
  const rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
  return `<div class="kb"><div class="field"><span>${S.active}  ${S.ans[S.active]||'<span style="color:#999">type the word</span>'}</span><span class="meta">1 word</span></div>
  ${rows.map(r=>`<div class="row">${[...r].map(k=>`<span>${k}</span>`).join('')}</div>`).join('')}
  <div class="row"><span>⌫</span><span class="wide">space</span><span data-k="ok" style="background:#181818;color:#fff;cursor:pointer">Done</span></div></div>`;
}
const screens=[
 {name:'1 · Start',notes:`<h2>Start</h2><ul><li>Opened from the <b>Tests</b> tab, like reading tests.</li><li><b>Exam</b>: one play, no pause, 30 min clock. <b>Study</b>: pause, −10 s, replay one question.</li><li>Audio goes to the paired Bluetooth headphones. Without them, Start explains how to pair.</li></ul>`,
  html:()=>`${topBar()}<div class="view home"><div class="card"><h2>Volunteer job at a local radio station</h2><div class="meta">Listening · Section 1 · 10 Q · audio 5:40</div>
  <div class="mode"><button class="${S.mode==='exam'?'sel':''}" data-m="exam">Exam<small>Plays once · timed</small></button><button class="${S.mode==='study'?'sel':''}" data-m="study">Study<small>Pause · rewind · replay a question</small></button></div>
  <p class="meta">🎧 Headphones: Bluetooth connected</p></div></div><div class="foot"><button class="primary" data-go="1">Start</button></div>`},
 {name:'2 · Listening',notes:()=>`<h2>While the audio plays</h2><ul><li>One screen: audio bar on top, questions below. No passage tab.</li><li>The bar redraws every 10 s, not every second (E Ink).</li>${S.mode==='exam'?'<li><b>Exam</b>: no controls, just where you are in the recording.</li>':'<li><b>Study</b>: −10 s, pause, and <b>↺ time</b> next to each question jumps to where its answer is.</li>'}<li>Multiple choice: tap a letter, as in reading.</li></ul><div class="q">Toggle Exam/Study on step 1 to compare.</div>`,
  html:()=>`${topBar()}${audio()}${questions()}<div class="foot"><button class="primary" data-go="4">Finish</button></div>`},
 {name:'3 · Typing a gap',notes:`<h2>Typing a gap</h2><ul><li>Tap a gap: the Kindle keyboard opens at the bottom and the audio keeps playing.</li><li>The field shows the word limit; over the limit gets a <b>!</b> as in reading.</li><li>Done closes the keyboard. Tap another gap to move on.</li></ul>`,
  html:()=>`${topBar()}${audio()}${questions().replace('class="view"','class="view" style="flex:0 1 auto;max-height:230px"')}${keyboard()}`},
 {name:'4 · Finish',notes:`<h2>Finish</h2><ul><li>Same confirm as reading: <i>Finish and see your score?</i></li><li>In Exam, the test also finishes on its own when the audio ends and the 2 minutes to check answers run out.</li></ul>`,
  html:()=>`${topBar()}${audio()}${questions()}<div style="position:absolute;left:30px;right:30px;top:200px;background:#fff;border:2px solid var(--ink);padding:16px"><p style="margin:0 0 14px;font:16px Georgia,serif">Finish and see your score?</p><div class="foot" style="border:1px solid var(--ink)"><button data-go="1">Cancel</button><button class="primary" data-go="4">Finish</button></div></div>`},
 {name:'5 · Results',notes:`<h2>Results</h2><ul><li>Score and band, as in reading.</li><li>Each row: <b>▶ Hear it</b> plays just that question's part of the audio; <b>Transcript</b> opens it at the answer.</li></ul>`,
  html:()=>`${topBar()}<div class="view"><div class="score">8/10</div><div class="meta">Band ≈ 7.0 · Exam</div>
  ${[[1,'reporter','reporter',1],[2,'Market','market',1],[3,'B','B',1],[4,'thursday','Tuesday',0]].map(([n,a,c,ok])=>`<div class="res"><span class="mark">${ok?'✓':'✗'}</span>${n}. ${a}${ok?'':` → <b>${c}</b>`} <button class="replay" data-go="5">▶ Hear it</button> <button class="replay" data-go="5">Transcript</button></div>`).join('')}
  </div><div class="foot"><button>Try again</button><button class="primary">Done</button></div>`},
 {name:'6 · Transcript',notes:`<h2>Transcript</h2><ul><li>Opens at the answer, highlighted, like <i>Show in passage</i>.</li><li>Tap a time to play from there. Tap any word for the dictionary (Leaf reading tools stay on).</li></ul>`,
  html:()=>`<div class="bar"><button class="ctl" data-go="4">← Results</button><span class="grow"></span><b>Transcript</b></div><div class="audio"><button class="ctl primary">▶</button><div class="track"><i style="width:68%"></i></div><span>03:52</span></div>
  <div class="view tr"><p><span class="who">MAN <span class="ts">03:41</span></span>So the training sessions, are they at the weekend?</p>
  <p><span class="who">WOMAN <span class="ts">03:48</span></span>No, we keep weekends free. <span class="ev">Everyone meets on Tuesday evening</span>, from seven until about nine.</p>
  <p><span class="who">MAN <span class="ts">03:58</span></span>That's fine. And do I need any experience with the equipment?</p></div>`},
];
function render(){
  document.getElementById('steps').innerHTML=screens.map((s,i)=>`<button class="${i===S.step?'sel':''}" data-go="${i}">${s.name}</button>`).join('')+` <button data-m="${S.mode==='exam'?'study':'exam'}">Mode: ${S.mode==='exam'?'Exam':'Study'} ⇄</button>`;
  const s=screens[S.step];
  document.getElementById('device').innerHTML=s.html();
  document.getElementById('notes').innerHTML=typeof s.notes==='function'?s.notes():s.notes;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-k]');if(!b)return;const d=b.dataset;
  if(d.go)S.step=+d.go;
  if(d.m)S.mode=d.m;
  if(d.g){S.active=+d.g;S.step=2}
  if(d.k==='ok')S.step=1;
  if(d.c)S.ans[3]=d.c;
  if(d.r)S.t=+d.r;
  if(d.a==='play')S.playing=!S.playing;
  if(d.a==='back')S.t=Math.max(0,S.t-10);
  render();
});
setInterval(()=>{if(S.playing&&S.step<4&&S.t<LEN){S.t++;if(S.step===1||S.step===2){const a=document.querySelector('.audio');if(a)a.outerHTML=audio()}}},1000);
render();
</script>
</body>
</html>
